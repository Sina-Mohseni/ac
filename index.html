<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GRIMOIRE · Anim'Connect</title>
<meta name="description" content="Grimoire Anim'Connect — bibliothèque, chronologies et personas.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f8fafd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131314" media="(prefers-color-scheme: dark)">

<!-- Choix du thème appliqué avant le premier rendu : pas de clignotement. -->
<script>
(function () {
  var pref = 'auto';
  try { pref = localStorage.getItem('ac-theme') || 'auto'; } catch (e) {}
  if (pref !== 'light' && pref !== 'dark') pref = 'auto';
  var el = document.documentElement;
  el.setAttribute('data-theme-pref', pref);
  if (pref === 'auto') el.removeAttribute('data-theme');
  else el.setAttribute('data-theme', pref);
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/timeline.css">
<link rel="stylesheet" href="css/guild.css">
<link rel="stylesheet" href="css/sheet.css">
</head>
<body>

<div id="bgstage"><div class="veil"></div></div>

<header id="hdr">
  <div class="hbar">
    <nav class="hnav hnav-home" aria-label="Guilde">
      <button data-act="go" data-view="guild" class="on" aria-label="Guilde" title="Guilde">
        <svg viewBox="0 0 24 24"><path d="M4 10l8-6 8 6v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg></button>
    </nav>
    <div class="brand" aria-label="Grimoire Anim'Connect">
      <svg class="sigil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/>
        <path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5A2.5 2.5 0 0 0 4 20.5z" opacity=".55"/>
        <path d="M9 7.5h6M9 11h4"/></svg>
      <span>Grimoire</span>
    </div>
    <nav class="hnav hnav-tools" id="hnav" aria-label="Outils">
      <button id="btnTheme" data-act="theme" aria-label="Thème jour ou nuit" title="Thème : automatique">
        <svg class="ic-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/>
          <path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none"/></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg>
        <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 14.4A8.5 8.5 0 0 1 9.6 4 8.5 8.5 0 1 0 20 14.4z"/></svg></button>
      <button data-act="go" data-view="music" aria-label="Musique" title="Musique">
        <svg viewBox="0 0 24 24"><path d="M9 17V5l10-2v12"/><circle cx="6" cy="17" r="3"/><circle cx="16" cy="15" r="3"/></svg></button>
      <button data-act="go" data-view="settings" aria-label="Paramètres" title="Paramètres">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg></button>
    </nav>
  </div>
  <div class="hpage">
    <h1 id="hTitle">Guilde</h1>
    <div class="sub" id="hSub">La grande salle</div>
  </div>
</header>

<main id="app">
  <div class="empty card" id="bootmsg">
    <span class="disp">Chargement du grimoire</span>
    Si rien n'apparaît, ouvre le dossier via un serveur local plutôt qu'en <span class="mono">file://</span> :<br>
    <span class="mono">cd animconnect &amp;&amp; python -m http.server 8080</span><br>puis <span class="mono">localhost:8080</span>
  </div>
</main>

<footer id="ftr">
  <div class="fbar">
    <nav class="fnav fnav-current" aria-label="Personas actuels">
      <button id="btnCurUser" data-act="go" data-view="profiles" aria-label="Profil actuel" title="Profil actuel">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></button>
      <button id="btnCurAi" data-act="go" data-view="personas" aria-label="IA actuelle" title="IA actuelle">
        <svg viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="12" rx="4"/><path d="M9 7V5l3-2 3 2v2M9 12h.01M15 12h.01M9 16h6"/></svg></button>
    </nav>
    <div class="sp"></div>
    <nav class="fnav fnav-roots" aria-label="Types de projets">
      <button data-act="branchMode" data-root="root-histoires" aria-label="Histoires" title="Histoires">
        <svg viewBox="0 0 24 24"><path d="M3 5.5A4.5 4.5 0 0 1 7.5 4H12v16H7.5A4.5 4.5 0 0 0 3 21z"/><path d="M21 5.5A4.5 4.5 0 0 0 16.5 4H12v16h4.5A4.5 4.5 0 0 1 21 21z"/></svg></button>
      <button data-act="branchMode" data-root="root-jeux" aria-label="Jeux" title="Jeux">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="8" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1" fill="currentColor" stroke="none"/></svg></button>
      <button data-act="branchMode" data-root="root-expo" aria-label="Expo" title="Expo">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="M5 17l4-4 3 3 3-4 4 5"/></svg></button>
    </nav>
    <nav class="fnav fnav-tools" aria-label="Personas">
      <button data-act="personaMode" aria-label="Personas" title="Personas">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.2"/><path d="M3.5 19a5.6 5.6 0 0 1 11 0"/><circle cx="17.5" cy="7.5" r="2.4"/><path d="M15 13.6a4.6 4.6 0 0 1 5.6 4"/></svg></button>
    </nav>
  </div>
</footer>

<div id="player">
  <div class="bandmedia" id="pBand"></div><div class="bandveil"></div>
  <div class="inner">
    <div class="row">
      <button class="pbtn btn-ghost" data-act="prev" aria-label="Piste précédente"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14l-11-7z"/></svg></button>
      <button class="pbtn btn-ember" data-act="toggle" aria-label="Lecture"><svg id="pIcon" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></button>
      <button class="pbtn btn-ghost" data-act="next" aria-label="Piste suivante"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg></button>
      <div style="flex:1;min-width:0">
        <div class="small" id="pTitle" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">—</div>
        <div class="tiny muted mono" id="pTime">0:00 / 0:00</div>
      </div>
      <button class="btn-sm btn-ghost" data-act="openFromPlayer">Ouvrir</button>
    </div>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Position de lecture">
  </div>
</div>

<div id="modalRoot"><div class="scrim" data-act="closeModal"></div><div class="sheet" id="sheet"></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
